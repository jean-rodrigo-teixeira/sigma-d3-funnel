<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Funnel · Sigma plugin built with D3</title>
  <style>
    :root {
      --surface: #fcfcfb; --surface-2: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
      --grid: #e1e0d9; --border: #ebeae4; --chip: #f4f3ef;
      --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4;
      --c6: #008300; --c7: #6250d6; --c8: #e34948; --c-other: #b9b8b0;
      --up: #0f7a3f; --down: #b3261e; --funnel: #2a78d6; --sep: #fcfcfb;
      --shadow: 0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.06);
      font: 13px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1a1a19; --surface-2: #222221; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
        --grid: #2c2c2a; --border: #30302d; --chip: #262624;
        --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
        --c6: #0ca30c; --c7: #9085e9; --c8: #e66767; --c-other: #5a5955;
        --up: #4cc38a; --down: #ff8a80; --funnel: #3987e5; --sep: #1a1a19; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      }
    }
    html, body { margin: 0; height: 100%; }
    body { background: transparent; }
    body.is-preview { background: var(--surface); }

    /* Shell: filter sidebar on the left, funnel on the right */
    .shell { height: 100%; display: grid; grid-template-columns: 264px minmax(0, 1fr); }
    .shell.no-sidebar { grid-template-columns: minmax(0, 1fr); }
    .shell.no-sidebar #filters { display: none; }
    body.is-preview .shell { max-width: 1320px; margin: 0 auto; }
    #app { min-height: 0; box-sizing: border-box; padding: 14px 18px 10px; display: flex; flex-direction: column; gap: 12px; }
    body.is-preview #app { padding: 26px 28px 18px; }

    /* Filter sidebar */
    .fp { box-sizing: border-box; height: 100%; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 18px 18px; border-right: 1px solid var(--border); background: var(--surface-2); }
    body.is-preview .fp { padding-top: 26px; }
    .fp-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .fp-title { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
    .fp-badge { font-size: 11px; font-weight: 600; background: var(--ink); color: var(--surface); border-radius: 999px; padding: 1px 7px; }
    .fp-top-actions { display: flex; align-items: center; gap: 6px; }
    .fp-collapse { display: none; font: inherit; background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--ink-2); cursor: pointer; padding: 2px 8px; }
    .fp-link { font: inherit; font-size: 12px; background: none; border: 0; padding: 0; color: var(--c1); cursor: pointer; }
    .fp-link:disabled { color: var(--muted); cursor: default; opacity: .6; }
    .fp-link:hover:not(:disabled) { text-decoration: underline; }
    .fp-section { padding: 14px 0; border-top: 1px solid var(--border); }
    .fp-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
    .fp-count { font-weight: 500; letter-spacing: 0; text-transform: none; margin-left: 4px; }
    .fp-row { display: flex; align-items: baseline; justify-content: space-between; }
    .fp-quick { display: flex; gap: 5px; color: var(--muted); font-size: 12px; }
    .fp-fixed { padding-bottom: 14px; }
    .fp-fixed-value { font-weight: 550; line-height: 1.35; }
    .fp-list { list-style: none; margin: 0; padding: 0; }
    .fp-list.is-long { max-height: 240px; overflow-y: auto; }
    .fp-list li { position: relative; display: flex; align-items: center; border-radius: 6px; }
    .fp-list li:hover { background: var(--chip); }
    .fp-check { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 5px 6px; cursor: pointer; }
    .fp-check input { position: absolute; opacity: 0; pointer-events: none; }
    .fp-box { --swatch: var(--ink); flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--muted); box-sizing: border-box; display: grid; place-items: center; transition: background .12s, border-color .12s; }
    .fp-check input:checked + .fp-box { background: var(--swatch); border-color: var(--swatch); }
    .fp-check input:checked + .fp-box::after { content: ""; width: 7px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
    .fp-check input:focus-visible + .fp-box { outline: 2px solid var(--c1); outline-offset: 2px; }
    .fp-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-check input:not(:checked) ~ .fp-name { color: var(--muted); }
    .fp-n { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .fp-only { position: absolute; right: 4px; font: inherit; font-size: 11px; color: var(--c1); background: var(--chip); border: 0; border-radius: 4px; padding: 2px 6px; cursor: pointer; opacity: 0; }
    .fp-list li:hover .fp-only, .fp-ms-list li:hover .fp-only, .fp-only:focus-visible { opacity: 1; }

    /* Multi-select dropdown */
    .fp-ms { position: relative; }
    .fp-ms-btn { position: relative; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2);
                 border: 1px solid var(--border); border-radius: 8px; padding: 8px 30px 8px 10px; cursor: pointer; }
    .fp-ms-btn span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-ms-btn::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); transition: transform .15s; }
    .fp-ms.is-open .fp-ms-btn::after { transform: translateY(-30%) rotate(-135deg); }
    .fp-ms-btn:hover:not(:disabled) { border-color: var(--grid); }
    .fp-ms-btn:focus-visible { outline: 2px solid var(--funnel); outline-offset: 1px; }
    .fp-ms-btn:disabled { color: var(--ink-2); background: var(--chip); cursor: default; }
    .fp-ms-btn:disabled::after { display: none; }
    .fp-field.is-active .fp-ms-btn, .fp-ms.is-open .fp-ms-btn { border-color: var(--funnel); box-shadow: 0 0 0 1px var(--funnel) inset; }
    .fp-ms-pop { position: absolute; z-index: 20; left: 0; right: 0; box-sizing: border-box; top: calc(100% + 6px); background: var(--surface-2); border: 1px solid var(--border);
                 border-radius: 10px; box-shadow: var(--shadow), 0 12px 32px rgba(11,11,11,.12); padding: 6px; }
    .fp-ms-actions { display: flex; justify-content: space-between; padding: 4px 6px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .fp-ms-list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
    .fp-ms-list li { position: relative; display: flex; align-items: center; border-radius: 6px; }
    .fp-ms-list li:hover { background: var(--chip); }
    .fp-ms-list .fp-check input:checked + .fp-box { background: var(--funnel); border-color: var(--funnel); }
    .fp-ms-list .fp-n { margin-right: 2px; }
    .fp-ms-list li:hover .fp-n { visibility: hidden; }
    .fp-seg { display: flex; background: var(--chip); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
    .fp-seg button { flex: 1; font: inherit; font-size: 12px; border: 0; background: none; color: var(--ink-2); padding: 5px 6px; border-radius: 6px; cursor: pointer; }
    .fp-seg button[aria-checked="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .fp-stages { display: grid; gap: 8px; }
    .fp-stages label { display: grid; grid-template-columns: 38px 1fr; align-items: center; font-size: 12px; color: var(--ink-2); }
    .fp-stages select { font: inherit; font-size: 12px; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); min-width: 0; }
    .fp-hint { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }
    .fp-summary { margin: 4px 0 0; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-2); }
    @media (max-width: 820px) {
      .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
      .fp { height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      .fp-collapse { display: inline-block; }
      .fp.is-collapsed .fp-body { display: none; }
      .fp.is-collapsed .fp-top { margin-bottom: 0; }
      .fp.is-collapsed .fp-collapse { transform: rotate(-90deg); }
      #app { min-height: 760px; }
    }

    /* Header */
    .fnl-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .fnl-title { font-size: 18px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
    .fnl-sub { margin: 3px 0 0; color: var(--ink-2); }
    .fnl-toggle { font: inherit; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border);
                  border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
    .fnl-toggle:hover { color: var(--ink); border-color: var(--grid); }

    /* KPI tiles */
    .fnl-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .fnl-kpi { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; box-shadow: var(--shadow); min-width: 0; }
    .fnl-kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fnl-kpi-value { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .fnl-kpi-note { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fnl-kpi-note[data-tone="up"] { color: var(--up); }
    .fnl-kpi-note[data-tone="down"] { color: var(--down); }
    .fnl-kpi-note[data-tone="up"]::before { content: "▲ "; font-size: 9px; }
    .fnl-kpi-note[data-tone="down"]::before { content: "▼ "; font-size: 9px; }

    /* Channel chips (legend + filter) */
    .fnl-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .fnl-chip { font: inherit; display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border-radius: 999px;
                border: 1px solid var(--border); background: var(--chip); color: var(--ink-2); cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    .fnl-chip:hover { color: var(--ink); border-color: var(--grid); }
    .fnl-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
    .fnl-chip:focus-visible, .fnl-toggle:focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }
    .fnl-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; vertical-align: -1px; margin-right: 6px; }
    .fnl-chip .fnl-swatch { margin-right: 0; }
    .fnl-swatch.is-all { background: conic-gradient(var(--c1) 0 20%, var(--c2) 0 40%, var(--c3) 0 60%, var(--c4) 0 80%, var(--c5) 0); border-radius: 50%; }

    /* Chart */
    .fnl-stage { position: relative; flex: 1; min-height: 480px; }
    .fnl-svg { position: absolute; inset: 0; overflow: visible; }
    .fnl-guides line { stroke: var(--grid); stroke-dasharray: 2 4; pointer-events: none; }
    .fnl-hit rect { fill: transparent; }
    .fnl-glow { fill: var(--funnel); opacity: .12; pointer-events: none; }
    .fnl-body { fill: var(--funnel); }
    .fnl-seps line { stroke: var(--sep); stroke-width: 3px; }
    .fnl-rowhl rect { fill: var(--ink); opacity: 0; transition: opacity .15s; }
    .fnl-rowhl rect.is-on { opacity: .14; }
    .fnl-hit rect { fill: transparent; cursor: pointer; }
    .fnl-stage-label text { text-anchor: middle; pointer-events: none; }
    .fnl-stage-name { font-size: 10.5px; letter-spacing: .07em; fill: var(--muted); font-weight: 600; }
    .fnl-stage-value { font-size: 20px; font-weight: 650; fill: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .fnl-stage-share { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
    .fnl-step rect { fill: var(--surface-2); stroke: var(--border); }
    .fnl-step text { text-anchor: middle; font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .fnl-step-rate { fill: var(--ink-2); font-weight: 600; }
    .fnl-step.is-weakest rect { fill: var(--ink); stroke: var(--ink); }
    .fnl-step.is-weakest .fnl-step-rate { fill: var(--surface); }
    .fnl-step { cursor: default; }
    .fnl-step-drop { fill: var(--muted); text-anchor: start !important; font-size: 11.5px; }
    .fnl-step text.fnl-step-rate { text-anchor: start; }
    .fnl-stage-label text { text-anchor: end; }

    .fnl-tooltip { position: absolute; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .12s;
                   background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
                   padding: 9px 12px; min-width: 190px; font-size: 12px; }
    .fnl-tt-title { font-weight: 650; display: flex; align-items: center; margin-bottom: 2px; }
    .fnl-tt-sub { color: var(--muted); margin-bottom: 6px; }
    .fnl-tt-row { display: flex; justify-content: space-between; gap: 18px; padding: 1px 0; color: var(--ink-2); }
    .fnl-tt-row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    .fnl-tt-total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 5px; }
    .fnl-tt-hint { color: var(--muted); margin-top: 6px; font-size: 11px; }
    .fnl-tt-sep { margin: 7px 0 3px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .fnl-tt-row i { font-style: normal; font-weight: 400; color: var(--muted); margin-left: 6px; display: inline-block; min-width: 40px; text-align: right; }

    /* Dropdown filters */
    .fp-field { display: block; margin-bottom: 14px; }
    .fp-field .fp-label { display: block; margin-bottom: 6px; }
    .fp-select { position: relative; display: block; }
    .fp-select::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
    .fp-select select { appearance: none; -webkit-appearance: none; width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 30px 8px 10px; cursor: pointer; text-overflow: ellipsis; }
    .fp-select select:hover:not(:disabled) { border-color: var(--grid); }
    .fp-select select:focus-visible { outline: 2px solid var(--funnel); outline-offset: 1px; }
    .fp-select select:disabled { color: var(--ink-2); background: var(--chip); cursor: default; opacity: 1; }
    .fp-field.is-active select { border-color: var(--funnel); box-shadow: 0 0 0 1px var(--funnel) inset; }
    .fp-divider { height: 1px; background: var(--border); margin: 4px 0 16px; }

    .fnl-table { position: absolute; inset: 0; overflow: auto; }
    .fnl-table table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    .fnl-table th, .fnl-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
    .fnl-table th:first-child { text-align: left; }
    .fnl-table thead th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .fnl-table tbody th { font-weight: 500; }

    .fnl-msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; }
    .fnl.is-empty .fnl-head, .fnl.is-empty .fnl-kpis, .fnl.is-empty .fnl-chips, .fnl.is-empty .fnl-foot, .fnl.is-empty .fnl-svg { visibility: hidden; }
    .fnl-foot { margin: 0; font-size: 11.5px; color: var(--muted); }

    @media (max-width: 720px) {
      .fnl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fnl-kpi-value { font-size: 20px; }
      .fnl-stage-value { font-size: 15px; }
    }
  </style>

  <!-- Pinned versions: a deploy must never change the libraries under live dashboards. -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <!-- The Sigma SDK's UMD bundle expects a global React, so load it first. -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js"></script>
</head>
<body>
  <div class="shell no-sidebar">
    <aside id="filters" aria-label="Filters"></aside>
    <main id="app"></main>
  </div>

  <script src="data/campaign_funnel.js?v=5"></script>
  <script src="src/funnel-chart.js?v=5"></script>
  <script src="src/filter-panel.js?v=5"></script>
  <script src="src/sigma-adapter.js?v=5"></script>
  <script>
    // Load diagnostics: explain what failed instead of showing a blank page.
    if (!window.d3 || !window.FlowFunnel || !window.FilterPanel) {
      document.getElementById('app').innerHTML =
        '<div style="max-width:560px;margin:48px auto;padding:16px 20px;border:1px solid #e1e0d9;border-radius:8px;line-height:1.5">' +
        '<strong>The chart could not be loaded.</strong><br>' +
        (!window.d3
          ? 'D3 could not be downloaded from cdn.jsdelivr.net. Check your connection or any blocker/antivirus.'
          : 'Files in <code>src/</code> were not found. Extract the whole zip and open <code>index.html</code> from the extracted folder.') +
        '</div>';
    }
  </script>
</body>
</html>
